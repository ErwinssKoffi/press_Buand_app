# Environnement de développement : backend Go + PostgreSQL. Aucun serveur Node.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eclat
      POSTGRES_PASSWORD: eclat_dev_password
      POSTGRES_DB: eclat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclat -d eclat"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    environment:
      ECLAT_ENV: development
      ECLAT_DATABASE_URL: postgres://eclat:eclat_dev_password@db:5432/eclat?sslmode=disable
      ECLAT_HTTP_ADDR: ":8080"
      ECLAT_STORAGE_DIR: /var/lib/eclat/storage
    volumes:
      - storage:/var/lib/eclat/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
  storage:
